# omni proxy stack — rathole (tunnel server) + Termix (browser terminal)
# + guacd (Termix's remote-desktop daemon) + omni (enrollment service).
# Reference stack, verified on a real deployment (Sept 2026).
#
# Host networking everywhere, on purpose: rathole binds each enrolled
# machine's forwarded port on 127.0.0.1:2201+, and Termix must reach those
# as loopback in the same network namespace. omni reaches Termix at
# 127.0.0.1:8090, and your reverse proxy reaches omni at 127.0.0.1:8070.
#
# Ports this stack owns: 2333 (rathole control, public via router
# forward), 8070 (omni, loopback, behind Caddy), 8090 (Termix, behind
# Caddy), 4822 (guacd, loopback use only), 2201+ (forwarded machines).

services:
  rathole:
    # Pinned to match omni's rathole.version — bump both together.
    image: rapiz1/rathole:v0.5.0
    container_name: omni_rathole
    restart: unless-stopped
    network_mode: host
    command: --server /etc/rathole/server.toml
    volumes:
      - ./rathole:/etc/rathole:ro

  omni:
    build:
      context: ./src
      dockerfile: server/Dockerfile
    container_name: omni_server
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./omni/omni.toml:/etc/omni/omni.toml:ro
      - ./omni/data:/var/lib/omni
      # omni owns server.toml; rathole hot-reloads it on change.
      - ./rathole:/etc/rathole
  termix:
    image: ghcr.io/lukegus/termix:latest
    container_name: omni_termix
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: "8090"
      GUACD_HOST: "127.0.0.1"
      GUACD_TUNNEL_HOST: "127.0.0.1"
      GUACD_RECORDING_PATH: "/termix-data/session_recordings/guacamole"
    volumes:
      - ./termix-data:/app/data
    depends_on:
      - guacd

  guacd:
    image: guacamole/guacd:1.6.0
    container_name: omni_guacd
    restart: unless-stopped
    network_mode: host
    # Only Termix (same host) talks to guacd — keep it off the LAN. The
    # image's entrypoint appends these after its own `-b 0.0.0.0`; last wins.
    command: ["-b", "127.0.0.1"]
    volumes:
      - ./termix-data:/termix-data
